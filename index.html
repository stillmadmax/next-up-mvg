<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Next Up MVG</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />

    <!-- Fullscreen without browser chrome when launched from the iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Next Up MVG" />
    <meta name="theme-color" content="#111315" />
    <!-- iOS ignores SVG here and applies its own mask, hence a full-bleed PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  </head>
  <body>
    <nav class="tabs">
      <button data-tab="favoriten">Favoriten</button>
      <button data-tab="naehe">In der Nähe</button>
    </nav>

    <main>
      <div data-view="favoriten">
        <button id="compact" class="viewmode" aria-pressed="false">Kompakt</button>
        <div id="favorites"></div>
        <form class="search" autocomplete="off" onsubmit="return false">
          <input id="search" type="search" placeholder="Haltestelle suchen …" />
          <ul id="results"></ul>
        </form>
      </div>

      <div data-view="naehe">
        <div id="nearby"></div>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
